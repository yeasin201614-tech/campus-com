// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    def kotlinVersion = findProperty('android.kotlinVersion')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

def configureShortCmake = { Project subproject ->
  def androidExt = subproject.extensions.findByName("android")
  if (androidExt != null) {
    androidExt.externalNativeBuild {
      cmake {
        buildStagingDirectory file("D:/cx/${subproject.name}")
      }
    }
    androidExt.defaultConfig {
      externalNativeBuild {
        cmake {
          arguments "-DCMAKE_OBJECT_PATH_MAX=220"
        }
      }
    }
  }
}

subprojects { subproject ->
  ["com.android.application", "com.android.library"].each { pluginId ->
    subproject.plugins.withId(pluginId) {
      configureShortCmake(subproject)
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
