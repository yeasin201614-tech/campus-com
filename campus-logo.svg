<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#101B62" />
      <stop offset="100%" stop-color="#4328BD" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="100" y1="130" x2="412" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16215A" />
      <stop offset="100%" stop-color="#6038ED" />
    </linearGradient>
    <linearGradient id="capGrad" x1="120" y1="40" x2="390" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6038ED" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle App Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="508" height="508" rx="113" stroke="rgba(255,255,255,0.15)" stroke-width="3" />

  <g filter="url(#dropShadow)" transform="translate(68, 80) scale(5.88)">
    <!-- Shield / Hexagon with C -->
    <path
      d="M32 17L52 24.5V41.5C52 48.2 43.2 55 32 59C20.8 55 12 48.2 12 41.5V24.5L32 17Z"
      fill="url(#shieldGrad)"
      stroke="rgba(255,255,255,0.22)"
      stroke-width="1.2"
    />
    <!-- Letter C cutout -->
    <path
      d="M39.5 32.5C38.4 30.1 35.8 28.6 32.6 28.6C27.9 28.6 24.4 32.1 24.4 36.8C24.4 41.5 27.9 45 32.6 45C36 45 38.7 43.4 39.8 40.8L44.6 42.6C42.7 47.2 38.2 50 32.5 50C24.8 50 19.2 44.5 19.2 36.8C19.2 29.1 24.8 23.6 32.5 23.6C38.1 23.6 42.5 26.3 44.4 30.6L39.5 32.5Z"
      fill="#FFFFFF"
    />
    <!-- Graduation Cap -->
    <path d="M32 5L55 14L32 23L9 14L32 5Z" fill="url(#capGrad)" />
    <!-- Cap Tassel (Vibrant Teal) -->
    <path d="M13 15.5V26" stroke="#19B99A" stroke-width="2.6" stroke-linecap="round" />
    <circle cx="13" cy="27.5" r="2.2" fill="#19B99A" />
  </g>
</svg>
